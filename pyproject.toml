# Python side of the project: cocotb tests and the golden model.
# Single source of truth for Python dependencies (CI and local use the same lock).
[project]
name = "neuro-silicon"
version = "0.1.0"
description = "Spiking motion-direction detector chip for Tiny Tapeout"
requires-python = ">=3.11"
dependencies = [
    "cocotb==2.1.0",
    "pytest==8.4.2",
    "pyyaml==6.0.2",
]

[tool.uv]
package = false   # not a library: nothing to build or install, just dependencies
