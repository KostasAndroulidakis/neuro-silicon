# Tiny Tapeout project information.
# This file is the single source of truth for: top module name, tile count,
# source file list and pinout. The test Makefile reads source_files from here.
project:
  title:        "neuro-silicon"
  author:       "Kostas"
  discord:      ""
  description:  "Spiking motion-direction detector: 2 LIF neurons + delay lines, SPI-configurable"
  language:     "Verilog"
  clock_hz:     10000           # TBD: slow clock so 1 tick ~ 0.1 ms (see docs/spec.md)
  tiles: "1x1"
  top_module:  "tt_um_neuro_silicon"
  source_files:
    - "nm_params.vh"
    - "lif_neuron.v"
    - "tt_um_neuro_silicon.v"

pinout:
  # Inputs
  ui[0]: "sensor_l"
  ui[1]: "sensor_r"
  ui[2]: "spi_sck"
  ui[3]: "spi_mosi"
  ui[4]: "spi_cs_n"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "dir_lr"
  uo[1]: "dir_rl"
  uo[2]: "spi_miso"
  uo[3]: "spike_a (debug)"
  uo[4]: "spike_b (debug)"
  uo[5]: "time_ref (debug)"
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (unused, configured as inputs)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
